<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scott & Jamo Training Log</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    max-width: 850px;
    margin: auto;
    padding: 18px;
    background: #f1f5f9;
    color: #1e293b;
  }
  h1 { margin-bottom: 4px; }
  .subtitle { color: #64748b; margin-top: 0; }
  .tabs { display: flex; gap: 8px; margin: 20px 0; }
  button, input, select, textarea {
    font: inherit;
    padding: 10px;
    border-radius: 8px;
  }
  button {
    border: 0;
    background: #1d4ed8;
    color: white;
    cursor: pointer;
  }
  button.secondary { background: #64748b; }
  button.delete { background: #b91c1c; }
  .tab { flex: 1; }
  .tab.active { background: #0f172a; }
  .panel, .entry {
    background: white;
    border-radius: 12px;
    padding: 16px;
    margin: 12px 0;
  }
  label { display: block; font-weight: bold; margin: 12px 0 5px; }
  input, select, textarea {
    width: 100%;
    border: 1px solid #cbd5e1;
    background: white;
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .exercise { border-top: 1px solid #e2e8f0; padding: 12px 0; }
  .exercise h3 { margin: 0 0 8px; font-size: 1rem; }
  .set-row { display: grid; grid-template-columns: 55px 1fr 1fr; gap: 8px; align-items: center; margin: 6px 0; }
  .muted { color: #64748b; font-size: .9rem; }
  .hidden { display: none; }
  .entry { border-top: 1px solid #e2e8f0; }
  .entry p { margin: 6px 0; }
  @media (max-width: 600px) {
    body { padding: 10px; }
    .grid { grid-template-columns: 1fr; }
    .tabs { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<h1>Scott & Jamo Training Log</h1>
<p class="subtitle">90-day training tracker</p>

<div class="tabs">
  <button class="tab active" id="tabWorkout" onclick="showTab('workout')">Strength Workouts</button>
  <button class="tab" id="tabActivity" onclick="showTab('activity')">Activity Log</button>
  <button class="tab" id="tabHistory" onclick="showTab('history')">History</button>
</div>

<section id="panelWorkout" class="panel">
  <h2>Log a Strength Workout</h2>
  <div class="grid">
    <div>
      <label for="person">Person</label>
      <select id="person"><option>Scott</option><option>Jamo</option></select>
    </div>
    <div>
      <label for="workoutDate">Date</label>
      <input type="date" id="workoutDate">
    </div>
  </div>
  <label for="workoutSelect">Workout</label>
  <select id="workoutSelect" onchange="renderExercises()"></select>
  <div id="exerciseList"></div>
  <label for="workoutNotes">Notes (optional)</label>
  <textarea id="workoutNotes" rows="2"></textarea>
  <p><button onclick="saveWorkout()">Save Workout</button></p>
</section>

<section id="panelActivity" class="panel hidden">
  <h2>Log Running or Baseball</h2>
  <div class="grid">
    <div>
      <label for="activityPerson">Person</label>
      <select id="activityPerson" onchange="updateActivityTypes()">
        <option>Scott</option><option>Jamo</option>
      </select>
    </div>
    <div>
      <label for="activityDate">Date</label>
      <input type="date" id="activityDate">
    </div>
  </div>
  <label for="activityType">Activity</label>
  <select id="activityType" onchange="renderActivityFields()"></select>
  <div id="activityFields"></div>
  <label for="activityNotes">Notes (optional)</label>
  <textarea id="activityNotes" rows="3" placeholder="Route, drills, effort, or other notes"></textarea>
  <p><button onclick="saveActivity()">Save Activity</button></p>
</section>

<section id="panelHistory" class="panel hidden">
  <h2>Training History</h2>
  <p><button class="secondary" onclick="exportCSV()">Export History to CSV</button></p>
  <div id="historyList"></div>
</section>

<script>
"use strict";

const workoutPlans = {
  "Workout A — Chest, Shoulders & Triceps": [
    ["Bench Press", 3, 8],
    ["Incline Dumbbell Press", 3, 10],
    ["Seated Shoulder Press", 3, 10],
    ["Lateral Raises", 2, 12],
    ["Triceps Pushdowns", 2, 12],
    ["Dead Bug", 2, 10]
  ],
  "Workout B — Back & Biceps": [
    ["Lat Pulldown", 3, 10],
    ["Seated Cable Row", 3, 10],
    ["Dumbbell Row", 2, 10],
    ["Face Pulls", 2, 12],
    ["Dumbbell Curls", 3, 10],
    ["Plank", 2, 30]
  ],
  "Workout C — Legs & Core": [
    ["Goblet Squat", 3, 10],
    ["Romanian Deadlift", 3, 10],
    ["Leg Press", 3, 12],
    ["Calf Raises", 2, 15],
    ["Plank", 3, 30],
    ["Dead Bug", 3, 10]
  ],
  "Workout D — Full Body": [
    ["Dumbbell Bench Press", 3, 10],
    ["Assisted Pullups", 3, 8],
    ["Dumbbell Lunges", 2, 10],
    ["Hip Thrust", 3, 10],
    ["Farmer's Carry", 3, 30]
  ]
};

const storageKey = "scottJamoTrainingLog";
let records = [];

try {
  records = JSON.parse(localStorage.getItem(storageKey) || "[]");
  if (!Array.isArray(records)) records = [];
} catch (error) {
  records = [];
}

function localDate() {
  const date = new Date();
  return date.getFullYear() + "-" +
    String(date.getMonth() + 1).padStart(2, "0") + "-" +
    String(date.getDate()).padStart(2, "0");
}

document.getElementById("workoutDate").value = localDate();
document.getElementById("activityDate").value = localDate();

const workoutSelect = document.getElementById("workoutSelect");
Object.keys(workoutPlans).forEach(function(name) {
  const option = document.createElement("option");
  option.value = name;
  option.textContent = name;
  workoutSelect.appendChild(option);
});

function showTab(name) {
  ["workout", "activity", "history"].forEach(function(tab) {
    document.getElementById("panel" + capitalize(tab)).classList.toggle("hidden", tab !== name);
    document.getElementById("tab" + capitalize(tab)).classList.toggle("active", tab === name);
  });
  if (name === "history") renderHistory();
}

function capitalize(value) {
  return value.charAt(0).toUpperCase() + value.slice(1);
}

function renderExercises() {
  const list = document.getElementById("exerciseList");
  list.innerHTML = "";
  const exercises = workoutPlans[workoutSelect.value] || [];

  exercises.forEach(function(exercise, exerciseIndex) {
    const name = exercise[0];
    const sets = exercise[1];
    const reps = exercise[2];
    const isTimed = name === "Plank" || name === "Farmer's Carry";

    const section = document.createElement("div");
    section.className = "exercise";

    const heading = document.createElement("h3");
    heading.textContent = name + " — " + sets + " sets × " + reps +
      (isTimed ? " seconds" : " reps");
    section.appendChild(heading);

    for (let setNumber = 1; setNumber <= sets; setNumber++) {
      const row = document.createElement("div");
      row.className = "set-row";

      const label = document.createElement("span");
      label.textContent = "Set " + setNumber;

      const repsInput = document.createElement("input");
      repsInput.type = "number";
      repsInput.min = "0";
      repsInput.value = reps;
      repsInput.placeholder = isTimed ? "Seconds" : "Reps";
      repsInput.id = "reps-" + exerciseIndex + "-" + setNumber;

      const weightInput = document.createElement("input");
      weightInput.type = "number";
      weightInput.min = "0";
      weightInput.step = "0.5";
      weightInput.placeholder = "Weight (lb)";
      weightInput.id = "weight-" + exerciseIndex + "-" + setNumber;

      row.appendChild(label);
      row.appendChild(repsInput);
      row.appendChild(weightInput);
      section.appendChild(row);
    }
    list.appendChild(section);
  });
}

function saveWorkout() {
  const exercises = (workoutPlans[workoutSelect.value] || []).map(function(exercise, index) {
    const sets = [];
    for (let setNumber = 1; setNumber <= exercise[1]; setNumber++) {
      sets.push({
        reps: document.getElementById("reps-" + index + "-" + setNumber).value,
        weight: document.getElementById("weight-" + index + "-" + setNumber).value
      });
    }
    return { name: exercise[0], sets: sets };
  });

  records.unshift({
    id: Date.now(),
    kind: "workout",
    person: document.getElementById("person").value,
    date: document.getElementById("workoutDate").value,
    name: workoutSelect.value,
    exercises: exercises,
    notes: document.getElementById("workoutNotes").value
  });

  saveRecords();
  document.getElementById("workoutNotes").value = "";
  alert("Workout saved!");
}

function updateActivityTypes() {
  const person = document.getElementById("activityPerson").value;
  const select = document.getElementById("activityType");
  select.innerHTML = "";

  const types = person === "Scott" ? ["Run"] : ["Pitching", "Baseball Practice"];
  types.forEach(function(type) {
    const option = document.createElement("option");
    option.value = type;
    option.textContent = type;
    select.appendChild(option);
  });
  renderActivityFields();
}

function renderActivityFields() {
  const type = document.getElementById("activityType").value;
  const fields = document.getElementById("activityFields");
  fields.innerHTML = "";

  if (type === "Run") {
    fields.innerHTML =
      '<div class="grid">' +
        '<div><label for="distance">Distance (miles)</label>' +
        '<input id="distance" type="number" min="0" step="0.01" placeholder="e.g. 3.1"></div>' +
        '<div><label for="duration">Time (minutes)</label>' +
        '<input id="duration" type="number" min="0" placeholder="e.g. 30"></div>' +
      '</div>';
  } else if (type) {
    fields.innerHTML =
      '<label for="duration">Duration (minutes)</label>' +
      '<input id="duration" type="number" min="0" placeholder="e.g. 60">';
  }
}

function saveActivity() {
  const type = document.getElementById("activityType").value;
  const record = {
    id: Date.now(),
    kind: "activity",
    person: document.getElementById("activityPerson").value,
    date: document.getElementById("activityDate").value,
    name: type,
    duration: document.getElementById("duration") ? document.getElementById("duration").value : "",
    notes: document.getElementById("activityNotes").value
  };

  if (type === "Run") {
    record.distance = document.getElementById("distance").value;
  }

  records.unshift(record);
  saveRecords();
  document.getElementById("activityNotes").value = "";
  alert("Activity saved!");
}

function saveRecords() {
  localStorage.setItem(storageKey, JSON.stringify(records));
  renderHistory();
}

function renderHistory() {
  const list = document.getElementById("historyList");
  list.innerHTML = "";

  if (records.length === 0) {
    list.textContent = "No entries yet. Save a workout or activity to get started.";
    return;
  }

  records.forEach(function(record) {
    const entry = document.createElement("div");
    entry.className = "entry";

    const title = document.createElement("strong");
    title.textContent = record.date + " — " + record.person + ": " + record.name;
    entry.appendChild(title);

    if (record.kind === "activity") {
      const details = [];
      if (record.distance) details.push(record.distance + " miles");
      if (record.duration) details.push(record.duration + " minutes");
      if (details.length) {
        const p = document.createElement("p");
        p.textContent = details.join(" • ");
        entry.appendChild(p);
      }
    } else {
      record.exercises.forEach(function(exercise) {
        const p = document.createElement("p");
        p.textContent = exercise.name + ": " + exercise.sets.map(function(set, index) {
          let text = "Set " + (index + 1) + " — " + (set.reps || "—");
          if (set.weight) text += " reps @ " + set.weight + " lb";
          return text;
        }).join("; ");
        entry.appendChild(p);
      });
    }

    if (record.notes) {
      const note = document.createElement("p");
      note.className = "muted";
      note.textContent = "Notes: " + record.notes;
      entry.appendChild(note);
    }

    const deleteButton = document.createElement("button");
    deleteButton.className = "delete";
    deleteButton.textContent = "Delete entry";
    deleteButton.onclick = function() {
      if (confirm("Delete this entry?")) {
        records = records.filter(function(item) { return item.id !== record.id; });
        saveRecords();
      }
    };
    entry.appendChild(deleteButton);
    list.appendChild(entry);
  });
}

function exportCSV() {
  const rows = [[
    "Date", "Person", "Type", "Name", "Exercise",
    "Set", "Reps/Seconds", "Weight (lb)", "Distance (mi)",
    "Duration (min)", "Notes"
  ]];

function exportCSV() {
  const rows = [[
    "Date", "Person", "Type", "Name", "Exercise",
    "Set", "Reps/Seconds", "Weight (lb)", "Distance (mi)",
    "Duration (min)", "Notes"
  ]];

  records.forEach(function(record) {
    if (record.kind === "activity") {
      rows.push([
        record.date,
        record.person,
        "Activity",
        record.name,
        "",
        "",
        "",
        "",
        record.distance || "",
        record.duration || "",
        record.notes || ""
      ]);
    } else {
      record.exercises.forEach(function(exercise) {
        exercise.sets.forEach(function(set, index) {
          rows.push([
            record.date,
            record.person,
            "Workout",
            record.name,
            exercise.name,
            index + 1,
            set.reps,
            set.weight,
            "",
            "",
            record.notes || ""
          ]);
        });
      });
    }
  });

  const csv = rows.map(function(row) {
    return row.map(function(value) {
      return '"' + String(value == null ? "" : value).replace(/"/g, '""') + '"';
    }).join(",");
  }).join("\n");

  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "scott-jamo-workout-history.csv";
  link.click();
  URL.revokeObjectURL(url);
}

renderExercises();
updateActivityTypes();
renderHistory();
</script>
</body>
</html>
